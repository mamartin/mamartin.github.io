<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Zpětná vazba · Jak věci fungují</title>
  <style>
    :root { --paper: #f1f2ed; --surface: #fbfbf9; --ink: #14181e; --ink-2: #464d58; --ink-3: #6b727d; --rule: #d2d5cb; --accent: #2442c2; --ok: #0d7d45; --warm: #b3640f; --bad: #cc3125; }
    @media (prefers-color-scheme: dark) { :root { --paper: #101317; --surface: #171b21; --ink: #e7e9e3; --ink-2: #b4bac3; --ink-3: #8a919c; --rule: #2c323b; --accent: #8fa2ff; --ok: #3fd27f; --warm: #f0a04b; --bad: #ff6a5c; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
    .muted { color: var(--ink-3); font-size: 0.9rem; }
    form.login { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.5rem; }
    input, select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--ink-3); padding: 0.5rem 0.7rem; border-radius: 0; }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    button.link { border: 0; background: none; padding: 0; color: var(--bad); font-weight: 500; font-size: 0.85rem; }
    .bar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 1.5rem 0 1rem; }
    .bar .grow { flex: 1 1 auto; }
    .totals { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin: 0 0 1rem; padding: 0; list-style: none; font-size: 0.9rem; color: var(--ink-2); }
    .totals b { color: var(--ink); }
    .item { margin: 0 0 0.8rem; padding: 0.9rem 1rem; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--ink-3); }
    .item.ano { border-left-color: var(--ok); } .item.zcasti { border-left-color: var(--warm); } .item.ne { border-left-color: var(--bad); }
    .head { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; align-items: baseline; font-size: 0.85rem; color: var(--ink-3); }
    .head a { color: var(--accent); font-weight: 600; font-size: 0.95rem; }
    .head .grow { flex: 1 1 auto; }
    .tag { font-weight: 600; }
    .tag.ano { color: var(--ok); } .tag.zcasti { color: var(--warm); } .tag.ne { color: var(--bad); }
    .item h3 { margin: 0.7rem 0 0.15rem; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
    .item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .error { color: var(--bad); margin-top: 0.8rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Zpětná vazba</h1>
    <p class="muted">Odpovědi čtenářů k článkům Jak věci fungují.</p>

    <form class="login" id="login">
      <label for="pass" class="muted" style="flex-basis:100%">Heslo do administrace</label>
      <input type="password" id="pass" autocomplete="current-password" required>
      <button type="submit" class="primary">Přihlásit</button>
    </form>
    <p class="error" id="error" role="alert" hidden></p>

    <section id="app" hidden>
      <div class="bar">
        <select id="f-article" aria-label="Článek"></select>
        <select id="f-rating" aria-label="Hodnocení">
          <option value="">Všechna hodnocení</option>
          <option value="ano">Srozumitelné</option>
          <option value="zcasti">Zčásti</option>
          <option value="ne">Nesrozumitelné</option>
          <option value="-">Bez hodnocení</option>
        </select>
        <span class="grow"></span>
        <button type="button" id="reload">Načíst znovu</button>
        <button type="button" id="export">Stáhnout vše</button>
        <button type="button" id="logout">Odhlásit</button>
      </div>
      <ul class="totals" id="totals"></ul>
      <div id="list"></div>
      <p class="muted" id="empty" hidden>Zatím nic nepřišlo.</p>
    </section>
  </main>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const SITE = new URL("../", location.href).href;        // administrace leží o složku níž než rozcestník
    const RATING = { ano: "srozumitelné", zcasti: "zčásti", ne: "nesrozumitelné" };
    const when = new Intl.DateTimeFormat("cs-CZ", { dateStyle: "medium", timeStyle: "short" });
    let pass = sessionStorage.getItem("jvf-admin") || "", items = [];

    async function call(method, query = "") {
      const res = await fetch(`/api/admin${query}`, { method, headers: { Authorization: `Bearer ${pass}` } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || "Něco se nepovedlo."), { status: res.status });
      return data;
    }
    function fail(err) {
      $("error").textContent = err.message;
      $("error").hidden = false;
      if (err.status === 401) { sessionStorage.removeItem("jvf-admin"); pass = ""; $("app").hidden = true; $("login").hidden = false; }
    }
    // text od čtenářů vkládáme jen jako text, nikdy jako HTML
    function node(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }

    function render() {
      const fa = $("f-article").value, fr = $("f-rating").value;
      const shown = items.filter((it) => (!fa || it.article === fa) && (!fr || (fr === "-" ? !it.rating : it.rating === fr)));
      const count = (r) => items.filter((it) => it.rating === r).length;
      $("totals").replaceChildren(...[["celkem", items.length], ["srozumitelné", count("ano")], ["zčásti", count("zcasti")], ["nesrozumitelné", count("ne")], ["zobrazeno", shown.length]].map(([name, n]) => { const li = node("li"); li.append(`${name} `, node("b", "", String(n))); return li; }));
      $("empty").hidden = items.length > 0;
      $("list").replaceChildren(...shown.map((it) => {
        const box = node("article", `item ${it.rating || ""}`), head = node("div", "head");
        const link = node("a", "", it.article);
        link.href = it.article === "rozcestnik" ? SITE : `${SITE}${encodeURIComponent(it.article)}/`;
        link.target = "_blank"; link.rel = "noopener";
        const del = node("button", "link", "Smazat");
        del.type = "button";
        del.addEventListener("click", async () => {
          if (!confirm("Opravdu smazat tuhle odpověď? Nejde to vrátit.")) return;
          try { await call("DELETE", `?path=${encodeURIComponent(it.path)}`); items = items.filter((x) => x !== it); render(); } catch (err) { fail(err); }
        });
        head.append(link, node("span", "", when.format(new Date(it.at))));
        if (it.rating) head.append(node("span", `tag ${it.rating}`, RATING[it.rating] || it.rating));
        head.append(node("span", "grow"), del);
        box.append(head);
        if (it.liked) box.append(node("h3", "", "Co se líbilo"), node("p", "", it.liked));
        if (it.missing) box.append(node("h3", "", "Co chybělo nebo nedávalo smysl"), node("p", "", it.missing));
        return box;
      }));
    }
    async function load() {
      $("error").hidden = true;
      try {
        items = (await call("GET")).items;
        const articles = [...new Set(items.map((it) => it.article))].sort(), keep = $("f-article").value;
        $("f-article").replaceChildren(new Option("Všechny články", ""), ...articles.map((a) => new Option(`${a} (${items.filter((it) => it.article === a).length})`, a)));
        if (articles.includes(keep)) $("f-article").value = keep;
        $("login").hidden = true; $("app").hidden = false;
        render();
      } catch (err) { fail(err); }
    }

    $("login").addEventListener("submit", (e) => { e.preventDefault(); pass = $("pass").value; sessionStorage.setItem("jvf-admin", pass); $("pass").value = ""; load(); });
    $("f-article").addEventListener("change", render);
    $("f-rating").addEventListener("change", render);
    $("reload").addEventListener("click", load);
    $("logout").addEventListener("click", () => { sessionStorage.removeItem("jvf-admin"); pass = ""; items = []; $("app").hidden = true; $("login").hidden = false; });
    $("export").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(items, null, 2)], { type: "application/json" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: `zpetna-vazba-${new Date().toISOString().slice(0, 10)}.json` });
      a.click();
      URL.revokeObjectURL(url);
    });
    if (pass) load();
  })();
  </script>
</body>
</html>
